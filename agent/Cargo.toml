[package]
name = "apiforge-agent"
version = "1.0.1"
description = "Request agent that lets the ApiForge web app send requests without browser CORS limits"
authors = ["ApiForge Contributors"]
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
apiforge-engine = { path = "../crates/apiforge-engine" }
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["cors", "fs"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
