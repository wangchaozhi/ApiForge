name: Desktop builds

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            # `app` produces the .app.tar.gz the updater downloads.
            bundles: app,dmg
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 rpm xdg-utils
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build installers
        if: ${{ ! inputs.release }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      # The bundler reads the updater public key from the Tauri config (the app gets it at
      # compile time via APIFORGE_UPDATER_PUBKEY), so release builds merge it in here.
      - name: Write release Tauri config
        if: ${{ inputs.release }}
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          test -n "$UPDATER_PUBKEY" || { echo "Missing TAURI_UPDATER_PUBKEY repository variable"; exit 1; }
          node -e "require('fs').writeFileSync('src-tauri/tauri.release.conf.json', JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.UPDATER_PUBKEY } } }, null, 2))"
      # Tauri attempts codesigning whenever APPLE_CERTIFICATE is set, even to an empty
      # string, so the Apple variables are exported only when a certificate is configured.
      - name: Configure macOS code signing
        if: ${{ inputs.release && runner.os == 'macOS' }}
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::macOS code signing secrets are not configured; building unsigned DMGs."
            exit 0
          fi
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            [ -n "$value" ] || continue
            { echo "$name<<__APIFORGE_EOF__"; printf '%s\n' "$value"; echo "__APIFORGE_EOF__"; } >> "$GITHUB_ENV"
          done
      - name: Build signed updater artifacts
        if: ${{ inputs.release }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
          APIFORGE_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config ${{ github.workspace }}/src-tauri/tauri.release.conf.json -- --locked
      # Portable build: the Tauri executable embeds the frontend, so unzipping it is enough
      # (WebView2 ships with Windows 10/11). Collected from bundle/portable below.
      - name: Package portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $release = "src-tauri/target/${{ matrix.target }}/release"
          $staging = Join-Path $env:RUNNER_TEMP 'ApiForge-portable'
          $output = "$release/bundle/portable"
          New-Item -ItemType Directory -Force $staging, $output | Out-Null
          Copy-Item "$release/apiforge.exe" (Join-Path $staging 'ApiForge.exe')
          Compress-Archive -Path "$staging/*" -DestinationPath "$output/ApiForge_${version}_x64-portable.zip" -Force
      - name: Collect installers and checksums
        run: node scripts/collect-artifacts.mjs ${{ matrix.target }} ${{ matrix.name }} ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14
