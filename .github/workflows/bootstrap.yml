name: Bootstrap source

on:
  push:
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand ApiForge source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 -d > /tmp/apiforge-src.tar.gz
          mkdir -p /tmp/apiforge-src
          tar -xzf /tmp/apiforge-src.tar.gz -C /tmp/apiforge-src
          rm -rf .bootstrap
          cp -a /tmp/apiforge-src/. .
          rm -f .github/workflows/bootstrap.yml

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: ApiForge v0.5.0"
          git push origin HEAD:main

# Triggered after all archive parts are present.
