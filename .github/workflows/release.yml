name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify version and tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: node scripts/check-release-version.mjs
      - name: Verify updater signing configuration
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$UPDATER_PUBLIC_KEY" || { echo "Missing TAURI_UPDATER_PUBKEY repository variable"; exit 1; }
          test -n "$UPDATER_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY repository secret"; exit 1; }
  build:
    needs: validate
    uses: ./.github/workflows/desktop-build.yml
    with:
      release: true
    secrets: inherit
  smoke:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-artifacts
          merge-multiple: true
      - run: node scripts/smoke-artifacts.mjs release-artifacts
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          node scripts/create-update-manifest.mjs release-artifacts "$RELEASE_TAG" "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "ApiForge $RELEASE_TAG" --generate-notes "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${args[@]}"
