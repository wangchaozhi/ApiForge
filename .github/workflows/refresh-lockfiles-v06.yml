name: Refresh v0.6 lockfiles

on:
  push:
    branches: ['develop/v0.6']

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop/v0.6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit generated lockfiles
        shell: bash
        run: |
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh lockfiles for Stronghold"
          git push origin HEAD:develop/v0.6
