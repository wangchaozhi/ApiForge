name: Refresh v0.7 Cargo lock

on:
  push:
    branches: ['develop/v0.7']

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop/v0.7
      - name: Refresh Cargo lockfile
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit generated lockfile
        shell: bash
        run: |
          git add src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Cargo.lock for Boa sandbox"
          git push origin HEAD:develop/v0.7
