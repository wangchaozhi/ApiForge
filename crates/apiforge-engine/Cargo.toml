[package]
name = "apiforge-engine"
version = "1.0.0"
description = "ApiForge HTTP request engine shared by the desktop app and the web agent"
authors = ["ApiForge Contributors"]
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
base64 = "0.23.1"
md-5 = "0.10.6"
rand = "0.9.2"
reqwest = { version = "0.13.5", features = ["json", "form", "multipart", "stream", "cookies", "native-tls"] }
reqwest_cookie_store = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["net"] }
url = "2.5.4"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "io-util"] }
